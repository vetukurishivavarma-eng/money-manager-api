spring.application.name=money-manager
server.port=${PORT:10000}
server.address=0.0.0.0

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Remove H2 Console
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatIsLongEnough12345678901234567890}
jwt.expiration=86400000

# CORS
cors.allowed-origins=*

# File Upload Limits (for profile images up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Increase body size for JSON payloads (base64 images)
server.tomcat.max-http-form-buffer-size=15MB
