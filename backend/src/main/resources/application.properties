spring.application.name=money-manager
server.port=${PORT:10000}
server.address=0.0.0.0

# Supabase PostgreSQL - Full connection from environment
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Remove H2 Console (not needed for Supabase)
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatIsLongEnough12345678901234567890}
jwt.expiration=86400000

# CORS (allow all origins for mobile app)
cors.allowed-origins=*
